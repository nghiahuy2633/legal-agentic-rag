    mới và không thay đổi danh tính của chủ thể; Hệ thống hỗ trợ công việc văn phòng mà người sử dụng
    có thể nhận biết rõ ràng bản chất chức năng là công cụ trí tuệ nhân tạo thông qua bối cảnh sử dụng
    và không có chức năng mô phỏng, giả lập có khả năng gây nhầm lẫn về danh tính, tính xác thực của sự
