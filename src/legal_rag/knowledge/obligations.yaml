  obligation: 'Nhà cung cấp và bên triển khai hệ thống trí tuệ nhân tạo phải thực hiện trách nhiệm minh
    bạch, thông báo, đánh dấu kỹ thuật và gắn nhãn hiển thị đối với hệ thống trí tuệ nhân tạo và nội dung
    do hệ thống tạo ra theo quy định tại Điều 11 của Luật Trí tuệ nhân tạo. Việc thực hiện trách nhiệm
    minh bạch phải phù hợp với mục đích sử dụng, bối cảnh triển khai và mức độ rủi ro của hệ thống. Nhà
    cung cấp và bên triển khai phải thực hiện các nghĩa vụ sau đây: Thông báo, đánh dấu kỹ thuật và gắn
    nhãn hiển thị đối với hệ thống trí tuệ nhân tạo và nội dung do hệ thống tạo ra theo quy định của pháp
    luật; Cung cấp thông tin về mục đích sử dụng, phạm vi áp dụng, điều kiện sử dụng và các hạn chế của
    hệ thống trí tuệ nhân tạo; Lưu trữ thông tin, tài liệu phục vụ việc kiểm tra, giám sát theo quy định
    của pháp luật. Nhà cung cấp và bên triển khai phải giải trình khi có yêu cầu bằng văn bản của cơ quan
    nhà nước có thẩm quyền theo quy định tại Điều 14 và Điều 15 của Luật Trí tuệ nhân tạo. Phạm vi, nội
    dung và thời hạn giải trình phải phù hợp với địa vị pháp lý của từng chủ thể và mức độ rủi ro của
    hệ thống. Khi thực hiện trách nhiệm giải trình và cung cấp thông tin theo quy định của pháp luật,
    nhà cung cấp và bên triển khai không bắt buộc phải tiết lộ mã nguồn, thuật toán chi tiết, dữ liệu
    huấn luyện, bộ tham số hoặc thông tin thuộc phạm vi bí mật kinh doanh, bí mật công nghệ, trừ trường
    hợp pháp luật có quy định khác.'
