  obligation: 'Nhà cung cấp hoặc bên triển khai phải báo cáo sơ bộ sự cố nghiêm trọng cho cơ quan nhà
    nước có thẩm quyền theo Mẫu AI01a đối với tổ chức hoặc Mẫu AI01b đối với cá nhân tại Phụ lục ban hành
    kèm theo Nghị định 142/2026/NĐ-CP thông qua Cổng thông tin điện tử một cửa về trí tuệ nhân tạo trong
    thời hạn như sau: Đối với các sự cố nghiêm trọng có tính khẩn cấp quy định tại điểm a, điểm d khoản
    1 Điều 19 Nghị định 142/2026/NĐ-CP và trường hợp không thể kiểm soát đối với quy định tại điểm c khoản
    1 Điều 19 Nghị định 142/2026/NĐ-CP: thực hiện báo cáo sơ bộ trong thời hạn 72 giờ kể từ thời điểm
    xác nhận sự cố; Đối với các sự cố nghiêm trọng còn lại: thực hiện báo cáo sơ bộ trong thời hạn 05
    ngày làm việc kể từ thời điểm xác nhận sự cố; Thời điểm xác nhận sự cố quy định tại khoản 3 Điều 19
    Nghị định 142/2026/NĐ-CP được tính từ khi tổ chức, cá nhân có đủ cơ sở thông tin ban đầu để xác định
    sự cố đã thực sự xảy ra và có khả năng cao bắt nguồn từ lỗi của hệ thống trí tuệ nhân tạo, không đợi
    đến khi hoàn thành điều tra toàn diện nguyên nhân kỹ thuật. Việc nộp báo cáo sơ bộ trong thời hạn
    quy định không bị coi là sự thừa nhận lỗi kỹ thuật hoặc trách nhiệm pháp lý của tổ chức, cá nhân báo
    cáo. Trường hợp bên triển khai không thể liên lạc với nhà cung cấp, bên triển khai có trách nhiệm
    thực hiện việc báo cáo theo quy định tại khoản 3 Điều 19 Nghị định 142/2026/NĐ-CP.'
