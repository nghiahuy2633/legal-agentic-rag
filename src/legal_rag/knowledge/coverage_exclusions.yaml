- clause_id: 142-2026-ND-CP_dieu-13_khoan-5
  reason: Thừa nhận kết quả đánh giá của tổ chức nước ngoài; quyền của nhà cung cấp, không tạo nghĩa vụ
    mới.
- clause_id: 142-2026-ND-CP_dieu-14_khoan-4
  reason: Bộ Khoa học và Công nghệ ghi nhận, cấp mã định danh; nhiệm vụ của cơ quan nhà nước.
- clause_id: 142-2026-ND-CP_dieu-16_khoan-5
  reason: Dẫn chiếu sang pháp luật về dữ liệu và bảo vệ dữ liệu cá nhân, ngoài phạm vi bốn văn bản.
- clause_id: 142-2026-ND-CP_dieu-19_khoan-5
