- clause_id: 142-2026-ND-CP_dieu-7_khoan-1
  reason: Cấu trúc Danh mục; không tạo nghĩa vụ cho doanh nghiệp.
- clause_id: 142-2026-ND-CP_dieu-7_khoan-2
  reason: Trách nhiệm của Ủy ban nhân dân cấp tỉnh và các bộ khi rà soát Danh mục; nhiệm vụ của cơ quan
    nhà nước.
- clause_id: 142-2026-ND-CP_dieu-8_khoan-2
  reason: Tiêu chí để cơ quan nhà nước đề xuất Danh mục; dùng cho phần gợi ý, không phải nghĩa vụ của
    doanh nghiệp.
- clause_id: 142-2026-ND-CP_dieu-8_khoan-4
  reason: Các bộ đề xuất hệ thống phải chứng nhận sự phù hợp; nhiệm vụ của cơ quan nhà nước.
- clause_id: 142-2026-ND-CP_dieu-10_khoan-2
  reason: Quyền không dùng công cụ phân loại tự động và giới hạn đối với cơ quan nhà nước; không tạo nghĩa
    vụ cho doanh nghiệp.
- clause_id: 142-2026-ND-CP_dieu-13_khoan-3
  reason: Quyền dùng kết quả đánh giá theo pháp luật chuyên ngành; không tạo nghĩa vụ mới.
- clause_id: 142-2026-ND-CP_dieu-13_khoan-4
  reason: Yêu cầu đối với tổ chức đánh giá sự phù hợp, không phải nghĩa vụ của doanh nghiệp được đánh
