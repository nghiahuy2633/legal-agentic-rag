      và trường hợp không thể kiểm soát đối với quy định tại điểm c khoản 1 Điều này: thực hiện báo cáo
      sơ bộ trong thời hạn 72 giờ kể từ thời điểm xác nhận sự cố;'
  - chunk_id: 142-2026-ND-CP_dieu-19_khoan-3_diem-b
    quote: 'Đối với các sự cố nghiêm trọng còn lại: thực hiện báo cáo sơ bộ trong thời hạn 05 ngày làm
