  - chunk_id: 142-2026-ND-CP_dieu-19_khoan-3_diem-c
    quote: Thời điểm xác nhận sự cố quy định tại khoản này được tính từ khi tổ chức, cá nhân có đủ cơ
      sở thông tin ban đầu để xác định sự cố đã thực sự xảy ra và có khả năng cao bắt nguồn từ lỗi của
      hệ thống trí tuệ nhân tạo, không đợi đến khi hoàn thành điều tra toàn diện nguyên nhân kỹ thuật.
