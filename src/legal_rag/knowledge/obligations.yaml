    trường hợp không phát hành ra công chúng thông qua bên thứ ba, nền tảng trung gian; Hệ thống được
    sử dụng trong hoạt động nghệ thuật, điện ảnh, trò chơi điện tử hoặc hoạt động sáng tạo khác; bối cảnh
    công bố thể hiện rõ nội dung mang tính hư cấu; Hệ thống trí tuệ nhân tạo chỉ thực hiện xử lý, phân
